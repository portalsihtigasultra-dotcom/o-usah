[package]
name = "o-usah-web"
version = "0.1.0"
edition = "2024"

[features]
ssr = ["leptos/ssr"]
hydrate = ["leptos/hydrate"]

[dependencies]
leptos = { version = "0.7", features = ["csr"] }
leptos_router = "0.7"
leptos_meta = "0.7"
leptos_axum = "0.7"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
gloo-net = "0.6"
web-sys = "0.3"
wasm-bindgen = "0.2"
o-usah-models = { path = "../../libs/models" }

[package.metadata.leptos]
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3001"
reload-port = 3002