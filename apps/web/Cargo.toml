[package]
name = "o-usah-web"
version = "0.1.0"
edition = "2024"

[dependencies]
leptos = { version = "0.7", features = ["csr", "ssr", "hydrate"] }
leptos_axum = "0.7"
leptos_router = "0.7"
leptos_meta = "0.7"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
gloo-net = "0.6"
web-sys = "0.3"
wasm-bindgen = "0.2"

o-usah-models = { path = "../../libs/models" }