[package]
name = "o-usah-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls", "chrono", "uuid", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

o-usah-core = { path = "../../libs/core" }
o-usah-models = { path = "../../libs/models" }
o-usah-db = { path = "../../libs/db" }
o-usah-auth = { path = "../../libs/auth" }
o-usah-domain-ch = { path = "../../libs/domain_ch" }
o-usah-export = { path = "../../libs/export" }
o-usah-import = { path = "../../libs/import" }