[package]
name = "o-usah-auth"
version = "0.1.0"
edition = "2024"

[dependencies]
jsonwebtoken = "9"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
o-usah-core = { path = "../core" }
o-usah-models = { path = "../models" }